[package]
name = "project_ma"
version = "0.2.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_distr = "0.4"
clap = { version = "4.0", features = ["derive"] }
log = "0.4"
env_logger = "0.10"
chrono = "0.4"

[profile.release]
opt-level = 'z'
lto = true
panic = 'abort'
strip = true
